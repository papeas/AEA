<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Admin — Reviews</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%233d6aa8'/%3E%3Cstop offset='1' stop-color='%23f2cf1d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='18' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M22 18 L22 38 L70 78 L70 88 L84 88 L84 18 L70 18 L70 62 Z'/%3E%3Ccircle cx='29' cy='80' r='8' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    .admin { width: min(760px, 92%); margin: 3rem auto 4rem; }
    .admin h1 { font-size: 1.8rem; margin-bottom: 0.4rem; }
    .admin > p { color: var(--ink-soft); font-size: 0.94rem; margin-bottom: 2rem; }
    .admin__config {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.4rem;
      margin-bottom: 2rem;
      display: grid;
      gap: 0.9rem;
    }
    .admin__config .field { margin-bottom: 0; }
    .admin__config .btn { justify-self: start; }
    .admin__status { font-size: 0.9rem; color: var(--ink-soft); min-height: 1.4em; }
    .admin__status.err { color: #b3453c; }
    .rev {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.2rem 1.4rem;
      margin-bottom: 1rem;
    }
    .rev--pending { border-left: 4px solid var(--gold); }
    .rev__top { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
    .rev__top strong { font-size: 1rem; }
    .rev__stars { color: var(--gold); letter-spacing: 2px; }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }
    .badge--pending { background: var(--gold-soft); color: #7a6304; }
    .badge--live { background: #e2efe5; color: #2e7d43; }
    .rev__text { font-size: 0.95rem; margin-bottom: 0.7rem; }
    .rev__meta { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 0.8rem; }
    .rev__actions { display: flex; gap: 0.6rem; }
    .btn--danger { background: #b3453c; color: #fff; }
    .btn--danger:hover { background: #93362e; }
  </style>
</head>
<body>
  <main class="admin">
    <a href="index.html" class="brand" style="margin-bottom:1.6rem">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 100 104" fill="#fff"><path d="M0 0 L0 27 L72 91 L72 104 L100 104 L100 0 L72 0 L72 64 Z"/><circle cx="13" cy="91" r="13"/></svg>
      </span>
      <span class="brand__name">Nexus</span>
    </a>
    <h1>Reviews admin</h1>
    <p>Approve or delete reviews submitted on the website. This page is just a viewer —
       without your secret token it can't change anything, so it's safe to host publicly.</p>

    <div class="admin__config">
      <label class="field">
        <span>Backend URL</span>
        <input type="url" id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec — leave empty if this page is served by server.js">
      </label>
      <label class="field">
        <span>Admin token / secret</span>
        <input type="password" id="apiToken" placeholder="The SECRET from Code.gs, or ADMIN_TOKEN from server.js">
      </label>
      <button class="btn btn--primary" id="loadBtn">Load reviews</button>
      <p class="admin__status" id="status"></p>
    </div>

    <div id="list"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const apiUrl = $("apiUrl");
    const apiToken = $("apiToken");
    const statusEl = $("status");
    const listEl = $("list");

    apiUrl.value = localStorage.getItem("nexus-admin-url") || "";
    apiToken.value = localStorage.getItem("nexus-admin-token") || "";

    function cfg() {
      const url = apiUrl.value.trim().replace(/\/$/, "");
      const token = apiToken.value.trim();
      localStorage.setItem("nexus-admin-url", url);
      localStorage.setItem("nexus-admin-token", token);
      return { url, token, sheets: url.includes("script.google.com") };
    }

    function setStatus(msg, isErr) {
      statusEl.textContent = msg;
      statusEl.className = "admin__status" + (isErr ? " err" : "");
    }

    async function api(action, id) {
      const { url, token, sheets } = cfg();
      if (sheets) {
        if (action === "all") {
          const res = await fetch(url + "?action=all&token=" + encodeURIComponent(token));
          return res.json();
        }
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action, token, id })
        });
        return res.json();
      }
      const q = "?token=" + encodeURIComponent(token);
      if (action === "all") {
        const res = await fetch(url + "/api/admin/reviews" + q);
        return res.json();
      }
      const res = await fetch(url + "/api/admin/" + action + q, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ id })
      });
      return res.json();
    }

    function render(reviews) {
      listEl.textContent = "";
      if (!reviews.length) {
        setStatus("No reviews yet.");
        return;
      }
      reviews
        .slice()
        .sort((a, b) => (a.approved === b.approved ? b.createdAt.localeCompare(a.createdAt) : a.approved - b.approved))
        .forEach((r) => {
          const card = document.createElement("div");
          card.className = "rev" + (r.approved ? "" : " rev--pending");

          const top = document.createElement("div");
          top.className = "rev__top";
          const name = document.createElement("strong");
          name.textContent = r.name + (r.business ? " · " + r.business : "");
          const stars = document.createElement("span");
          stars.className = "rev__stars";
          stars.textContent = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
          const badge = document.createElement("span");
          badge.className = "badge " + (r.approved ? "badge--live" : "badge--pending");
          badge.textContent = r.approved ? "Live" : "Pending";
          top.append(name, stars, badge);

          const text = document.createElement("p");
          text.className = "rev__text";
          text.textContent = r.text;

          const meta = document.createElement("p");
          meta.className = "rev__meta";
          meta.textContent = new Date(r.createdAt).toLocaleString();

          const actions = document.createElement("div");
          actions.className = "rev__actions";
          if (!r.approved) {
            const ok = document.createElement("button");
            ok.className = "btn btn--small btn--primary";
            ok.textContent = "Approve";
            ok.onclick = () => act("approve", r.id);
            actions.appendChild(ok);
          }
          const del = document.createElement("button");
          del.className = "btn btn--small btn--danger";
          del.textContent = "Delete";
          del.onclick = () => {
            if (confirm("Delete this review permanently?")) act("delete", r.id);
          };
          actions.appendChild(del);

          card.append(top, text, meta, actions);
          listEl.appendChild(card);
        });
    }

    async function load() {
      setStatus("Loading…");
      try {
        const data = await api("all");
        if (data.error) throw new Error(data.error);
        render(data);
        if (data.length) {
          const pending = data.filter((r) => !r.approved).length;
          setStatus(data.length + " review(s), " + pending + " pending.");
        }
      } catch (e) {
        setStatus("Could not load reviews: " + e.message, true);
      }
    }

    async function act(action, id) {
      try {
        const out = await api(action, id);
        if (out.error) throw new Error(out.error);
        await load();
      } catch (e) {
        setStatus(action + " failed: " + e.message, true);
      }
    }

    $("loadBtn").addEventListener("click", load);
    if (apiToken.value) load();
  </script>
</body>
</html>
